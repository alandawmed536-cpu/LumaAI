<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumaAI - ژووری چاتی پێشکەوتوو</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between overflow-hidden">

    <!-- سەرپەڕە -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg flex items-center justify-between">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/30 text-white font-bold text-lg">
                L
            </div>
            <div>
                <h1 class="text-base font-bold text-white">Luma AI</h1>
                <p class="text-xs text-emerald-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    ئامادەیە بۆ یارمەتیدان
                </p>
            </div>
        </div>
        <button onclick="clearChat()" class="text-slate-400 hover:text-white p-2 rounded-xl transition cursor-pointer">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
    </header>

    <!-- بەشی گفتوگۆ -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- پەیامی سەرەتایی بۆت -->
        <div class="flex items-start space-x-3 space-x-reverse">
            <div class="w-8 h-8 bg-indigo-600 rounded-xl flex items-center justify-center text-white shrink-0 text-sm font-bold">L</div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl max-w-[80%] text-sm shadow-md">
                سڵاو! من <b>Luma AI</b> مە، لەلایەن گەنجێکی کوردی لێهاتووەوە دروستکراوم. چۆن دەتوانیم هاوکاریت بکەم ئەمڕۆ؟
            </div>
        </div>
    </main>

    <!-- بەشی نوسینی پەیام -->
    <footer class="bg-slate-900 border-t border-slate-800 p-4">
        <form id="chatForm" onsubmit="handleSendMessage(event)" class="flex items-center space-x-2 space-x-reverse max-w-4xl mx-auto">
            <input type="text" id="userInput" placeholder="پەیامەکەت لێرە بنووسە..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl transition shadow-lg shadow-indigo-500/20 cursor-pointer flex items-center justify-center">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </footer>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        function handleSendMessage(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;

            // نیشاندانی پەیامی بەکارهێنەر
            appendMessage(text, 'user');
            userInput.value = '';

            // وەڵامدانی Luma AI
            setTimeout(() => {
                generateAIResponse(text);
            }, 600);
        }

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 space-x-reverse ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            wrapper.innerHTML = `
                <div class="w-8 h-8 ${isUser ? 'bg-emerald-600' : 'bg-indigo-600'} rounded-xl flex items-center justify-center text-white shrink-0 text-sm font-bold">
                    ${isUser ? '<i class="fa-solid fa-user text-xs"></i>' : 'L'}
                </div>
                <div class="${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-100'} p-4 rounded-2xl max-w-[80%] text-sm shadow-md">
                    ${escapeHTML(text)}
                </div>
            `;
            
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function generateAIResponse(query) {
            let response = "سوپاس بۆ پرسیارەکەت! من Luma AI مە؛ زیرەکییەکی دەستکردم کە لەلایەن گەنجێکی کوردی ئازاوە دروستکراوم و هیچ پەیوەندییەکی ئەپلیکەیشنیم بە کۆمپانیاکانی تری وەک گوگلەوە نییە.";
            
            const lowerQuery = query.toLowerCase();
            if(lowerQuery.includes('کێ دروستت') || lowerQuery.includes('کێ دروستکردووی') || lowerQuery.includes('دروستکراوی کی')) {
                response = "من لەلایەن کەسێکی کوردی زیرەکەوە دروستکراوم و ناوم Luma AI مە.";
            } else if(lowerQuery.includes('گوگل') || lowerQuery.includes('google')) {
                response = "من هیچ پەیوەندییەکی ئەپلیکەیشنی یان بنەڕەتی بە گوگلەوە نییە؛ من تەواو سەربەخۆم و بە دەستی کەسێکی کورد دروستکراوم.";
            }

            appendMessage(response, 'ai');
        }

        function clearChat() {
            chatContainer.innerHTML = `
                <div class="flex items-start space-x-3 space-x-reverse">
                    <div class="w-8 h-8 bg-indigo-600 rounded-xl flex items-center justify-center text-white shrink-0 text-sm font-bold">L</div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl max-w-[80%] text-sm shadow-md">
                        سڵاو! من <b>Luma AI</b> مە، لەلایەن گەنجێکی کوردی لێهاتووەوە دروستکراوم. چۆن دەتوانیم هاوکاریت بکەم؟
                    </div>
                </div>
            `;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
