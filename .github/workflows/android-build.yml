name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk Apex-Drifter-3D.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-drifter-debug-apk
          path: Apex-Drifter-3D.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Apex Drifter 3D APK
          body: Download the latest APK for Apex Drifter 3D.
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            Apex-Drifter-3D.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
