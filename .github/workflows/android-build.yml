name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip wget
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export CMDLINE_TOOLS=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          mkdir -p "$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          cp -R /tmp/cmdline/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          export PATH="$PATH:$CMDLINE_TOOLS"
          yes | "$CMDLINE_TOOLS/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.3" "cmdline-tools;latest"
          yes | "$CMDLINE_TOOLS/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.3" >> "$GITHUB_PATH"

      - name: Install Gradle 8.7.4
        run: |
          set -e
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.7.4-bin.zip -O gradle-8.7.4-bin.zip
          unzip -q gradle-8.7.4-bin.zip
          echo "/tmp/gradle-8.7.4/bin" >> "$GITHUB_PATH"

      - name: Build APK (debug)
        working-directory: android_app
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android_app/build.log

      - name: Find APK (debug)
        id: find_apk
        run: |
          apk=$(find "$GITHUB_WORKSPACE/android_app/app/build/outputs" -path "*/debug/*.apk" | head -n 1)
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to latest-build release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          TAG="latest-build"
          echo "Checking existing release for $TAG"
          release_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$API/releases/tags/$TAG" || true)
          release_id=$(python3 -c "import sys, json; s=sys.stdin.read().strip(); print(json.loads(s).get('id','') if s else '')" <<<"$release_json")
          if [ -z "$release_id" ]; then
            echo "Creating release $TAG"
            create_resp=$(curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Latest Android debug APK\",\"draft\":false,\"prerelease\":false}" "$API/releases")
            release_id=$(python3 -c "import sys, json; s=sys.stdin.read().strip(); print(json.loads(s).get('id','') if s else '')" <<<"$create_resp")
          fi
          assets_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$API/releases/$release_id/assets")
          asset_id=$(python3 -c "import sys, json; j=json.load(sys.stdin); print(next((a.get('id') for a in j if a.get('name')=='app-release.apk'), ''))" <<<"$assets_json")
          if [ -n "$asset_id" ]; then
            curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" "$API/releases/assets/$asset_id" >/dev/null
          fi
          upload_url=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$API/releases/$release_id" | python3 -c "import sys, json; s=sys.stdin.read().strip(); print(json.loads(s).get('upload_url','').split('{')[0] if s else '')")
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$APK_PATH" "$upload_url?name=app-release.apk" >/dev/null
          echo "Public download URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android_app/app/build/outputs/**/*.apk
